<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="cg.css">
</head>
<body>

    <!-- Header -->

    <header class="header">

        <div class="logo">
            
        </div>

        <nav class="navbar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home</a>
            <a href="#">Beauty</a>
            <a href="#">GenZ</a>
            <a href="#">Studio</a>
        </nav>

        <div class="search-box">
            <input type="text" placeholder="Search">
        </div>

        <div class="header-icons">
            <div>PROFILE</div>
            <div>WISHLIST</div>
            <div>BAG</div>
        </div>

    </header>

    <!-- Offer Banner -->

    <section class="offer-banner">
        <h2>Flat 50% OFF</h2>
    </section>

    <!-- Hero Banner -->

    <section class="hero-banner">
        <div class="hero-image">
        </div>
    </section>

    <!-- Brand Section -->

    <section class="brand-section">

        <h2>BIGGEST DEALS ON TOP BRANDS</h2>

        <div class="brand-container">

            <div class="brand-card"></div>
            <div class="brand-card"> </div>
            <div class="brand-card"></div>
            <div class="brand-card"></div>
            <div class="brand-card"></div>
            <div class="brand-card"></div>

        </div>

    </section>

    <!-- Save Bigger Section -->

    <section class="save-section">

        <h2>SHOP SMART, SAVE BIGGER</h2>

        <div class="save-container">

            <div class="save-card"> </div>
            <div class="save-card"></div>
            <div class="save-card"></div>
            <div class="save-card"></div>

        </div>

    </section>

    <!-- Shop By Category -->

    <section class="category-section">

        <h2>SHOP BY CATEGORY</h2>

        <div class="category-container">

            <div class="category-card">Category 1</div>
            <div class="category-card">Category 2</div>
            <div class="category-card">Category 3</div>
            <div class="category-card">Category 4</div>
            <div class="category-card">Category 5</div>
            <div class="category-card">Category 6</div>
            <div class="category-card">Category 7</div>
            <div class="category-card">Category 8</div>

        </div>

    </section>

</body>
</html>
